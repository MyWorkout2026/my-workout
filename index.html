<!DOCTYPE html>
<html>

<head>

<title>MyWorkout</title>

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<style>

body{
font-family:sans-serif;
padding:20px;
}

input,
select,
button{

width:100%;
padding:12px;
margin-bottom:10px;

}

.card{

border:1px solid #ddd;

padding:12px;

margin-bottom:10px;

border-radius:10px;

}

</style>

</head>

<body>

<h1>
🏋️ MyWorkout
</h1>

<h3>
Maskiner
</h3>

<input
id="machine"
list="machines"
placeholder="Ny eller välj maskin">

<datalist
id="machines">
</datalist>

<input
id="weight"
type="number"
placeholder="Kg">

<input
id="sets"
type="number"
placeholder="Set">

<input
id="reps"
type="number"
placeholder="Reps">

<button
onclick="saveMachine()">

Spara maskin

</button>

<h3>
Aktiviteter
</h3>

<input
id="activity"
list="activities"
placeholder="Ny eller välj aktivitet">

<datalist
id="activities">
</datalist>

<input
id="minutes"
type="number"
placeholder="Minuter">

<button
onclick="saveActivity()">

Spara aktivitet

</button>

<h2>
Historik
</h2>

<div
id="list">
</div>

<script>

let data=

JSON.parse(

localStorage
.getItem(
"myworkout"
)

)

||

{

machines:[],
activities:[],
history:[]

};

render();

function save(){

localStorage
.setItem(

"myworkout",

JSON.stringify(
data
)

);

}

function saveMachine(){

const machine=
value(
"machine"
);

if(!machine)
return;

const item={

date:

new Date()
.toLocaleDateString(
"sv-SE"
),

machine,

weight:
value(
"weight"
),

sets:
value(
"sets"
),

reps:
value(
"reps"
)

};

data.history
.unshift(
item
);

if(

!data
.machines
.includes(
machine
)

)

data
.machines
.push(
machine
);

save();

clear();

render();

}

function saveActivity(){

const activity=
value(
"activity"
);

if(
!activity
)
return;

const item={

date:

new Date()
.toLocaleDateString(
"sv-SE"
),

activity,

minutes:

value(
"minutes"
)

};

data.history
.unshift(
item
);

if(

!data
.activities
.includes(
activity
)

)

data
.activities
.push(
activity
);

save();

clear();

render();

}

function value(id){

return document
.getElementById(
id
)
.value;

}

function clear(){

document
.querySelectorAll(
"input"
)

.forEach(

x=>
x.value=""

);

}

function render(){

document
.getElementById(
"machines"
)

.innerHTML=

data
.machines

.map(

x=>

`<option>

${x}

</option>`

)

.join("");

document
.getElementById(
"activities"
)

.innerHTML=

data
.activities

.map(

x=>

`<option>

${x}

</option>`

)

.join("");

document
.getElementById(
"list"
)

.innerHTML=

data
.history

.map(

x=>

`

<div
class=
card>

<b>

${x.date}

</b>

<br>

${

x.machine

?

`${x.machine}
•
${x.weight}kg
•
${x.sets}×${x.reps}`

:

`${x.activity}
•
${x.minutes}min`

}

</div>

`

)

.join("");

}

</script>

</body>

</html>
