<!DOCTYPE html>
<html>

<head>

<title>MyWorkout</title>

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<style>

body{
padding:20px;
font-family:sans-serif;
}

input,
select,
button{

width:100%;
padding:12px;
margin-bottom:10px;

}

.card{

border:1px solid #ddd;

padding:10px;

margin-bottom:10px;

}

</style>

</head>

<body>

<h1>🏋️ MyWorkout</h1>

<h3>Maskiner</h3>

<select
id="machineSelect"
onchange="fillMachine()">

<option>
Välj maskin
</option>

</select>

<input
id="machine"
placeholder="Ny maskin">

<input
id="weight"
type="number"
placeholder="Kg">

<input
id="sets"
type="number"
placeholder="Set">

<input
id="reps"
type="number"
placeholder="Reps">

<button
onclick="saveMachine()">

Spara maskin

</button>

<h3>Aktiviteter</h3>

<select
id="activitySelect"
onchange="fillActivity()">

<option>

Välj aktivitet

</option>

</select>

<input
id="activity"
placeholder="Ny aktivitet">

<input
id="minutes"
type="number"
placeholder="Minuter">

<button
onclick="saveActivity()">

Spara aktivitet

</button>

<h2>Historik</h2>

<div
id="list">
</div>

<script>

let data=

JSON.parse(

localStorage
.getItem(
"myworkout"

)

)

||

{

machines:{},

activities:{},

history:[]

};

render();

function save(){

localStorage
.setItem(

"myworkout",

JSON.stringify(
data
)

);

}

function saveMachine(){

const machine=

value(
"machine"
);

if(!machine)
return;

data
.machines[
machine
]={

weight:
value(
"weight"
),

sets:
value(
"sets"
),

reps:
value(
"reps"
)

};

data
.history
.unshift({

date:

new Date()

.toLocaleDateString(

"sv-SE"

),

machine,

weight:
value(
"weight"
),

sets:
value(
"sets"
),

reps:
value(
"reps"
)

});

save();

render();

clear();

}

function saveActivity(){

const activity=
value(
"activity"
);

if(!activity)
return;

data
.activities[
activity
]={

minutes:

value(
"minutes"

)

};

data
.history
.unshift({

date:

new Date()

.toLocaleDateString(

"sv-SE"

),

activity,

minutes:

value(
"minutes"

)

});

save();

render();

clear();

}

function fillMachine(){

const m=

value(
"machineSelect"
);

if(
!data
.machines[
m
]
)
return;

document
.getElementById(
"machine"
)
.value=m;

document
.getElementById(
"weight"
)
.value=
data
.machines[
m
]
.weight;

document
.getElementById(
"sets"
)
.value=
data
.machines[
m
]
.sets;

document
.getElementById(
"reps"
)
.value=
data
.machines[
m
]
.reps;

}

function fillActivity(){

const a=
value(
"activitySelect"
);

if(
!data
.activities[
a
]
)
return;

document
.getElementById(
"activity"
)
.value=a;

document
.getElementById(
"minutes"
)
.value=

data
.activities[
a
]
.minutes;

}

function render(){

document
.getElementById(
"machineSelect"
)

.innerHTML=

"<option>Välj maskin</option>"+

Object
.keys(

data
.machines

)

.map(

x=>

`<option>

${x}

</option>`

)

.join("");

document
.getElementById(
"activitySelect"
)

.innerHTML=

"<option>Välj aktivitet</option>"+

Object
.keys(

data
.activities

)

.map(

x=>

`<option>

${x}

</option>`

)

.join("");

document
.getElementById(
"list"
)

.innerHTML=

data
.history

.map(

x=>

`

<div
class=
card>

<b>

${x.date}

</b>

<br>

${

x.machine

?

`${x.machine}
•
${x.weight}kg
•
${x.sets}×${x.reps}`

:

`${x.activity}
•
${x.minutes}min`

}

</div>

`

)

.join("");

}

function clear(){

document
.querySelectorAll(
"input"
)

.forEach(

x=>
x.value=""

);

}

function value(id){

return document
.getElementById(
id
)
.value;

}

</script>

</body>

</html>
