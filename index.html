<!DOCTYPE html>
<html>

<head>
<title>MyWorkout</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>

<h1>🏋️ MyWorkout</h1>

<input id="machine" placeholder="Maskin">

<br><br>

<input id="weight" type="number" placeholder="Vikt kg">

<br><br>

<input id="sets" type="number" placeholder="Set">

<br><br>

<input id="reps" type="number" placeholder="Reps">

<br><br>

<button onclick="saveWorkout()">
Spara träning
</button>

<h2>Mina träningar</h2>

<div id="list"></div>

<script>

let workouts=
JSON.parse(
localStorage.getItem(
"workouts"
)
)||[];

show();

function saveWorkout(){

const machine=
document.getElementById(
"machine"
).value;

const weight=
document.getElementById(
"weight"
).value;

const sets=
document.getElementById(
"sets"
).value;

const reps=
document.getElementById(
"reps"
).value;

if(
!machine||
!weight
)return;

const today=
new Date()
.toLocaleDateString(
"sv-SE"
);

workouts.unshift({

date:today,
machine,
weight,
sets,
reps

});

localStorage.setItem(
"workouts",
JSON.stringify(
workouts
)
);

document
.querySelectorAll(
"input"
)
.forEach(
x=>x.value=""
);

show();

}

function removeWorkout(i){

workouts.splice(i,1);

localStorage.setItem(
"workouts",
JSON.stringify(
workouts
)
);

show();

}

function show(){

document
.getElementById(
"list"
)
.innerHTML=

workouts
.map(
(w,i)=>

`

<div>

<p>

<b>
${w.date}
</b>

</p>

<p>

${w.machine}

•

${w.weight} kg

•

${w.sets}×${w.reps}

</p>

<button
onclick=
"removeWorkout(${i})">

🗑️ Radera

</button>

<hr>

</div>

`

)
.join("");

}

</script>

</body>

</html>
