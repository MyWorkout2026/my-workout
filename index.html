<!DOCTYPE html>
<html>
<head>
<title>MyWorkout</title>
</head>

<body>

<h1>🏋️ MyWorkout</h1>

<input id="machine" placeholder="Maskin">
<br><br>

<input id="weight" type="number" placeholder="Vikt">
<br><br>

<button onclick="saveWorkout()">
Spara träning
</button>

<h2>Mina träningar</h2>

<div id="list"></div>

<script>

let workouts =
JSON.parse(
localStorage.getItem("workouts")
) || [];

show();

function saveWorkout(){

const machine =
document.getElementById("machine").value;

const weight =
document.getElementById("weight").value;

workouts.push({
machine,
weight
});

localStorage.setItem(
"workouts",
JSON.stringify(workouts)
);

show();

}

function show(){

document.getElementById(
"list"
).innerHTML = workouts
.map(
w =>
`<p>${w.machine}
- ${w.weight} kg</p>`
)
.join("");

}

</script>

</body>
</html>
