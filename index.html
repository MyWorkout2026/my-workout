
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Workout</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background:#0f172a;
color:white;
padding-bottom:40px;
}

header{
padding:30px 20px 10px;
font-size:34px;
font-weight:700;
}

.container{
padding:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:22px;
margin-bottom:20px;
}

h2{
margin-top:0;
}

input, select{
width:100%;
padding:16px;
border:none;
border-radius:14px;
margin-top:10px;
margin-bottom:14px;
font-size:17px;
box-sizing:border-box;
}

button{
width:100%;
padding:18px;
background:#2563eb;
color:white;
border:none;
border-radius:16px;
font-size:17px;
font-weight:bold;
}

button:active{
transform:scale(0.98);
}

.stat{
font-size:34px;
font-weight:bold;
}

.small{
color:#94a3b8;
margin-bottom:8px;
}

.success{
margin-top:14px;
color:#4ade80;
font-weight:bold;
display:none;
}

.history-item{
padding:12px 0;
border-bottom:1px solid rgba(255,255,255,0.08);
}

.history-item:last-child{
border-bottom:none;
}

.latest{
background:#0f172a;
padding:14px;
border-radius:14px;
margin-bottom:18px;
}

</style>

</head>

<body>

<header>
My Workout
</header>

<div class="container">

<div class="card">

<h2>Logga pass</h2>

<div class="latest" id="latestWorkout">
Ingen tidigare övning
</div>

<select id="exercise">

<option value="">Välj övning</option>

<option>Benpress</option>
<option>Benspark</option>
<option>Lårcurl</option>

<option>Latsdrag</option>
<option>Sittande rodd</option>

<option>Chest Press</option>
<option>Pec Deck</option>

<option>Axelpress</option>

<option>Cable Curl</option>
<option>Triceps Pushdown</option>

<option>Plankan</option>

<option>Annan övning</option>

</select>
<select id="exercise">

<option value="">Välj övning</option>

<option>Benpress</option>
<option>Benspark</option>
<option>Lårcurl</option>

<option>Latsdrag</option>
<option>Sittande rodd</option>

<option>Chest Press</option>
<option>Pec Deck</option>

<option>Axelpress</option>

<option>Cable Curl</option>
<option>Triceps Pushdown</option>

<option>Plankan</option>

<option>Annan övning</option>

</select>
<input type="number" id="weight" placeholder="Vikt kg">

<input type="number" id="reps" placeholder="Reps">

<input type="number" id="sets" placeholder="Set">

<button onclick="saveWorkout()">Spara</button>

<div class="success" id="successMessage">
✓ Sparat
</div>

</div>

<div class="card">

<div class="small">Antal pass</div>
<div class="stat" id="total">0</div>

</div>

<div class="card">

<h2>Framsteg</h2>

<canvas id="chart"></canvas>

</div>

<div class="card">

<h2>Historik</h2>

<div id="history"></div>

</div>

</div>

<script>

let workouts = JSON.parse(localStorage.getItem("myworkout")) || [];

function saveWorkout(){

const exercise = document.getElementById("exercise").value;
const weight = Number(document.getElementById("weight").value);
const reps = Number(document.getElementById("reps").value);
const sets = Number(document.getElementById("sets").value);

if(!exercise || !weight || !reps || !sets){
alert("Fyll i alla fält");
return;
}

const workout = {
exercise,
weight,
reps,
sets,
date:new Date().toLocaleDateString()
};

workouts.push(workout);

localStorage.setItem("myworkout", JSON.stringify(workouts));

document.getElementById("exercise").value = "";
document.getElementById("weight").value = "";
document.getElementById("reps").value = "";
document.getElementById("sets").value = "";

const success = document.getElementById("successMessage");

success.style.display = "block";

setTimeout(()=>{
success.style.display = "none";
},1500);

render();

}

function render(){

document.getElementById("total").innerText = workouts.length;

const latest = workouts[workouts.length - 1];

if(latest){

document.getElementById("latestWorkout").innerHTML =
`
Senast:<br><br>
<strong>${latest.exercise}</strong><br>
${latest.weight} kg × ${latest.reps} reps × ${latest.sets} set
`;

}

const labels = workouts.map(w => w.date);
const data = workouts.map(w => w.weight);

const ctx = document.getElementById("chart");

if(window.chart){
window.chart.destroy();
}

window.chart = new Chart(ctx,{
type:'line',
data:{
labels:labels,
datasets:[{
label:'Viktutveckling',
data:data
}]
}
});

const history = document.getElementById("history");

history.innerHTML = "";

workouts.slice().reverse().forEach(w=>{

history.innerHTML += `
<div class="history-item">
<strong>${w.exercise}</strong><br>
${w.weight} kg × ${w.reps} reps × ${w.sets} set
</div>
`;

});

}

render();

</script>

</body>
</html>
