<!DOCTYPE html>
<html>

<head>
<title>MyWorkout</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
padding:20px;
font-family:sans-serif;
}

.card{
padding:12px;
margin-bottom:10px;
border:1px solid #ddd;
border-radius:10px;
}

input,
button{
padding:10px;
margin-bottom:10px;
width:220px;
}

</style>

</head>

<body>

<h1>🏋️ MyWorkout</h1>

<h3 id="days"></h3>

<input id="machine" placeholder="Maskin">

<br>

<input id="weight"
type="number"
placeholder="Vikt kg">

<br>

<input id="sets"
type="number"
placeholder="Set">

<br>

<input id="reps"
type="number"
placeholder="Reps">

<br>

<button onclick="saveWorkout()">

Spara träning

</button>

<h2>Mina träningar</h2>

<div id="list"></div>

<script>

let workouts=
JSON.parse(
localStorage.getItem(
"workouts"
)
)||[];

show();

function saveWorkout(){

const machine=
machineInput();

const weight=
value("weight");

const sets=
value("sets");

const reps=
value("reps");

if(
!machine||
!weight
)return;

workouts.unshift({

date:
new Date()
.toLocaleDateString(
"sv-SE"
),

machine,
weight,
sets,
reps

});

save();

clear();

show();

}

function value(id){

return document
.getElementById(
id
)
.value;

}

function machineInput(){

return value(
"machine"
);

}

function save(){

localStorage.setItem(
"workouts",

JSON.stringify(
workouts
)

);

}

function clear(){

document
.querySelectorAll(
"input"
)

.forEach(

x=>
x.value=""

);

}

function removeWorkout(i){

workouts.splice(
i,
1
);

save();

show();

}

function show(){

const days=

[
...new Set(

workouts.map(
x=>
x.date
)

)

];

document
.getElementById(
"days"
)

.innerHTML=

`📅 Träningsdagar:
${days.length}`;

document
.getElementById(
"list"
)

.innerHTML=

workouts

.map(

(w,i)=>

`

<div class="card">

<b>

${w.date}

</b>

<p>

${w.machine}

•

${w.weight} kg

•

${w.sets}×${w.reps}

</p>

<button
onclick=
"removeWorkout(${i})">

🗑️

</button>

</div>

`

)

.join("");

}

</script>

</body>

</html>
