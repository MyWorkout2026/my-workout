<!DOCTYPE html>
<html>

<head>

<title>MyWorkout</title>

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<style>

body{
padding:20px;
font-family:sans-serif;
}

input,
select,
button{

width:100%;
padding:12px;
margin-bottom:10px;

}

.card{

border:1px solid #ddd;

padding:10px;

margin-bottom:10px;

}

</style>

</head>

<body>

<h1>🏋️ MyWorkout</h1>
<p id="today"></p>
<h3>Maskiner</h3>

<select
id="machineSelect"
onchange="fillMachine()">

<option>
Välj maskin
</option>

</select>
<button onclick="deleteMachine()">
🗑 Ta bort maskin
</button>

<input
id="machine"
placeholder="Ny maskin">

<input
id="sets"
type="number"
value="3"
placeholder="Set">

<input
id="reps"
type="number"
value="10"
placeholder="Reps">

<input
id="weight"
type="number"
placeholder="Kg">

<button onclick="saveMachine()">
Spara maskin
</button>

<button onclick="saveTraining()">
Spara träning
</button>

<p id="today"></p>

<div class="history">
Historik visas här
</div>
<h3>Aktiviteter</h3>

<select
id="activitySelect"
onchange="fillActivity()">

<option>

Välj aktivitet

</option>

</select>
<button onclick="deleteActivity()">🗑 Ta bort aktivitet</button>
<input
id="activity"
placeholder="Ny aktivitet">

<input
id="minutes"
type="number"
placeholder="Minuter">

<button
onclick="saveActivity()">

Spara aktivitet

</button>

<h2>Historik</h2>

<div
id="list">
</div>

<script>

let data=

JSON.parse(

localStorage
.getItem(
"myworkout"

)

)

||

{

machines:{},

activities:{},

history:[]

};

render();

function save(){

localStorage
.setItem(

"myworkout",

JSON.stringify(
data
)

);

}

function saveMachine(){

const machine=

value(
"machine"
)

if(!machine)
return;

data
data.machines[machine]={

weight:
value(
"weight"
),

sets:
value(
"sets"
),

reps:
value(
"reps"
),
setting:
value(
"setting"
),

};


data.history.unshift({
date:new Date().toLocaleDateString("sv-SE"),
machine:machine,
weight:value("weight"),
sets:value("sets"),
reps:value("reps"),
setting:value("setting")
});
save();
clear();
render();
}

function saveActivity(){

const activity=
value(
"activity"
);

if(!activity)
return;

data
.activities[
activity
]={

minutes:

value(
"minutes"

)

};

data
.history
.unshift({

date:

new Date()

.toLocaleDateString(

"sv-SE"

),

activity,

minutes:

value(
"minutes"

)

});

save();
clear();
render();

}

function fillMachine(){

const m=

value(
"machineSelect"
);

if(
!data
.machines[
m
]
)
return;

document
.getElementById(
"machine"
)
.value=m;

document
.getElementById(
"weight"
)
.value=
data
.machines[
m
]
.weight;

document
.getElementById(
"sets"
)
.value=
data
.machines[
m
]
.sets;

document
.getElementById(
"reps"
)
.value=
data
.machines[
m
]
.reps;
document
.getElementById(
"setting"
)
.value=
data
.machines[
m
]
.setting;
  
}
function deleteMachine(){

const m=value("machineSelect")

if(!m || m==="Välj maskin") return

delete data.machines[m]

save()

render()

clear()

}
function fillActivity(){

const a=
value(
"activitySelect"
);

if(
!data
.activities[
a
]
)
return;

document
.getElementById(
"activity"
)
.value=a;

document
.getElementById(
"minutes"
)
.value=

data
.activities[
a
]
.minutes;

}
function deleteActivity(){

const a=value("activity")

if(!a) return

delete data.activities[a]

save()

render()

clear()

}
}
function render(){
document.getElementById("today").innerHTML =
new Date().toLocaleDateString("sv-SE");

document
.getElementById(
"machineSelect"
)

.innerHTML=

"<option>Välj maskin</option>"+

Object
.keys(

data
.machines

)

.map(

x=>

`<option>

${x}

</option>`

)

.join("");

document
.getElementById(
"activitySelect"
)

.innerHTML=

"<option>Välj aktivitet</option>"+

Object
.keys(

data
.activities

)

.map(

x=>

`<option>

${x}

</option>`

)

.join("");

document
.getElementById(
"list"
)

.innerHTML=

data
.history

.map(

x=>

`

x=>
`
<div class="card">

<b>

${x.date}

</b>

<br>

${
x.machine
? `${x.machine} • ${x.weight} kg • ${x.sets}×${x.reps}`
: `${x.activity} • ${x.minutes} min`
}

}

</div>

`

)

.join("");

}
function sparaMaskin(){

save();

show();

}
function clear(){

document
.querySelectorAll(
"input"
)

.forEach(

x=>
x.value=""

);

}

function value(id){

return document
.getElementById(
id
)
.value;

}

</script>

</body>

</html>
